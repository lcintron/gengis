name: Deploy site

# Publishes GitHub Pages from a tag or branch on demand. The Release workflow already deploys the site
# for every release; use this to redeploy an older tag or to deploy without releasing.
# Repository setting required once: Settings -> Pages -> Source: "GitHub Actions".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to deploy
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'dist' --exclude 'electron' \
                   --exclude 'scripts' --exclude 'branding/source' --exclude 'Makefile' --exclude 'package.json' \
                   --exclude 'package-lock.json' --exclude 'serve.js' --exclude '.claude' ./ site/
          echo "Deployed ${{ github.ref_name }} on $(date -u +%FT%TZ)" > site/VERSION.txt
          ls site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
