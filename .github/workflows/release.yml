name: Release

# Releases are cut on demand, never by a merge. Start one from Actions -> Release -> Run workflow (on main)
# or with: gh workflow run release.yml -f bump=auto
#   1. "version": work out the semantic-version bump from the conventional commits since the last tag (or
#      use the bump chosen in the form), update the version shown in the app, commit, tag and push.
#      With "auto" and only chore/docs/ci commits since the last tag there is nothing to release and the
#      run stops here.
#   2. "build": build the Windows, macOS and Linux installers from that tag.
#   3. "android": build the Android APK from the same tag: a signed APK and Play bundle (.aab) when the
#      ANDROID_* signing secrets are set, otherwise a debug APK (installable for testing). Best-effort:
#      a failed Android build does not hold back the installers or the Release.
#   4. "publish": create the GitHub Release with the installers, the Android APK and generated notes.
#   5. "deploy-pages": publish GitHub Pages from the release tag.
# Tick "Dry run" to see the version a run would release without changing anything.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads the commits since the last release)
        type: choice
        default: auto
        options: [auto, patch, minor, major, prerelease]
      prerelease:
        description: Pre-release label (Beta, rc or alpha; a label not in use yet starts at .0); empty for a normal release
        type: string
        default: ''
      dry_run:
        description: Dry run (only report the version this would release)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # no lock file to key a cache on (setup-node caches npm by default since v5)
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check inputs
        # Inputs reach the shell only through env vars (never interpolated into the script) and are
        # allowlisted here; runs are also refused from any ref other than main.
        env:
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          PRE: ${{ inputs.prerelease }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main only; run the workflow on main (got $REF)."
            exit 1
          fi
          case "$BUMP" in auto|patch|minor|major|prerelease) ;;
            *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
          esac
          # Dot-separated identifiers of letters, digits and dashes (the semver pre-release form): no "..",
          # no leading or trailing dot, no all-digit identifier with a leading zero ("01"). git has the last
          # word, so the tag is a valid ref before anything is committed; scripts/release.js then refuses a
          # label the Android versionCode cannot order (it takes Beta, rc and alpha: android-prepare.js).
          if [ "${#PRE}" -gt 30 ] || [[ ! "$PRE" =~ ^([0-9A-Za-z][0-9A-Za-z-]*(\.[0-9A-Za-z][0-9A-Za-z-]*)*)?$ ]] \
             || [[ "$PRE" =~ (^|\.)0[0-9]+(\.|$) ]] \
             || ! git check-ref-format "refs/tags/v0.0.0${PRE:+-$PRE}"; then
            echo "::error::Pre-release label must be dot-separated groups of letters, digits or dashes, with no leading zeros in numeric groups, e.g. Beta or rc (got '$PRE')."
            exit 1
          fi
      - name: Bump version, commit, tag and push
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          PRE: ${{ inputs.prerelease }}
          DRY: ${{ inputs.dry_run && '1' || '' }}
        run: make release CI=1 BUMP="$BUMP" PRE="$PRE" DRY="$DRY"
      - name: Summary
        if: always()
        env:
          RELEASED: ${{ steps.release.outputs.released }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "Released **$TAG**. The installers, the Android APK, the GitHub Release and the site deploy follow in this run." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DRY" = "true" ] && [ -n "$TAG" ]; then
            echo "Dry run: this would release **$TAG**. Nothing was changed." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$VERSION" ]; then
            echo "Nothing to release: no feat/fix/perf commits since the last release (current version $VERSION). Choose a bump other than auto to release anyway." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release was made; see the log of the failed step." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # no lock file to key a cache on (setup-node caches npm by default since v5)
      - name: Install build tooling
        run: npm install --no-audit --no-fund
      - name: Cloud sign-in secrets
        shell: bash
        env:
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          # Google's desktop client secret, kept out of the repository (without it the app offers OneDrive only)
          if [ -n "$GOOGLE_DESKTOP_CLIENT_SECRET" ]; then
            node -e 'require("fs").writeFileSync("electron/cloud-secrets.json", JSON.stringify({ googleDesktopSecret: process.env.GOOGLE_DESKTOP_CLIENT_SECRET }))'
          else
            echo "::warning::GOOGLE_DESKTOP_CLIENT_SECRET is not set: the desktop app will not offer Google Drive"
          fi
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds; add signing secrets here when available
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read   # it only builds; the Release is published by the publish job
    env:
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}   # the upload key is set: signed release builds too
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # no lock file to key a cache on
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Android project
        run: |
          node scripts/build-web.js
          npx cap add android
          npx cap sync android
          node scripts/android-prepare.js
      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Release AAB and APK (signed)
        if: env.SIGNED == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GENGIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GENGIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GENGIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT   # gone whether the build succeeds or not
          export GENGIS_KEYSTORE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Collect artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Named like the desktop installers (GenGIS-<version>-...). Signed builds ship the release APK and
          # the Play bundle; without the signing secrets only the debug APK exists, installable for testing.
          mkdir -p out
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/GenGIS-$VERSION-android.apk"
            if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
              cp android/app/build/outputs/bundle/release/app-release.aab "out/GenGIS-$VERSION-android.aab"
            fi
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/GenGIS-$VERSION-android-debug.apk"
          fi
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, build, android]
    # !cancelled(): the Android APK is best-effort, so a failed android job must not hold back the Release, but
    # cancelling the run stops it. Skipped when nothing was released or the installers failed.
    if: ${{ !cancelled() && needs.version.outputs.released == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: GenGIS ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          append_body: true   # the note below is kept alongside the generated notes, not in place of them
          body: |
            **Android:** `GenGIS-${{ needs.version.outputs.version }}-android-debug.apk` is a debug build, for testing and fresh installs: it will not install over a previous GenGIS APK (uninstall that one first). A signed release APK will replace it once app signing is set up.
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          files: installers/*

  deploy-pages:
    name: Deploy site from ${{ needs.version.outputs.tag }}
    needs: [version, publish]
    # Gated on publish itself: a skipped publish skips the deploy, but a failed android job (which only
    # reaches here as publish being "skipped" without this) must not keep a real release off the site.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a --include '/.well-known/***' --exclude '.*' --exclude 'node_modules' --exclude 'dist' --exclude 'electron' \
                   --exclude 'scripts' --exclude 'branding/source' --exclude 'Makefile' --exclude 'package.json' \
                   --exclude 'package-lock.json' --exclude 'serve.js' --exclude '.claude' --exclude 'tests' \
                   --exclude 'android-src' --exclude 'capacitor.config.json' ./ site/
          echo "${{ needs.version.outputs.tag }} deployed $(date -u +%FT%TZ)" > site/VERSION.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true # (.well-known only: every other dotfile is left out above)
      - id: deployment
        uses: actions/deploy-pages@v5
