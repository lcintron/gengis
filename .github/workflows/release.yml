name: Release

# Fully automated release:
#   1. "version": on every push to main (a merged PR), work out the semantic-version bump from the
#      conventional commits since the last tag, update the version shown in the app, commit, tag and push.
#      Nothing to release (only chore/docs/ci commits) means the run stops here.
#   2. "build": build the Windows, macOS and Linux installers from that tag.
#   3. "publish": create the GitHub Release with the installers and generated notes.
#   4. "deploy-pages": publish GitHub Pages from the release tag.
# Run it manually (Actions -> Release -> Run workflow) to force a bump or a pre-release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: auto
        options: [auto, patch, minor, major, prerelease]
      prerelease:
        description: Pre-release label (e.g. Beta); empty for a normal release
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    # skip the push that the release itself creates
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version, commit, tag and push
        id: release
        run: make release CI=1 BUMP="${{ inputs.bump || 'auto' }}" PRE="${{ inputs.prerelease }}"

  build:
    name: Build (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tooling
        run: npm install --no-audit --no-fund
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds; add signing secrets here when available
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: GenGIS ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          files: installers/*

  deploy-pages:
    name: Deploy site from ${{ needs.version.outputs.tag }}
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'dist' --exclude 'electron' \
                   --exclude 'scripts' --exclude 'branding/source' --exclude 'Makefile' --exclude 'package.json' \
                   --exclude 'package-lock.json' --exclude 'serve.js' --exclude '.claude' ./ site/
          echo "${{ needs.version.outputs.tag }} deployed $(date -u +%FT%TZ)" > site/VERSION.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
